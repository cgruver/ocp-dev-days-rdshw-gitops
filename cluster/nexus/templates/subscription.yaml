---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: "{{ include "nexus.name" . }}-operatorgroup"
  namespace: {{ include "nexus.namespace" . }}
  annotations:
    {{- include "nexus-operatorgroup.argocd-syncwave" . | nindent 4 }}
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ include "nexus.name" . }}-operator
  namespace: {{ include "nexus.namespace" . }}
  annotations:
    {{- include "nexus.argocd-syncwave" . | nindent 4 }}
spec:
  channel: {{ .Values.nexus.subscription.channel }}
  installPlanApproval: {{ .Values.nexus.subscription.installPlanApproval }}
  name: {{ .Values.nexus.subscription.name }}
  source: {{ .Values.nexus.subscription.source }}
  sourceNamespace: {{ .Values.nexus.subscription.sourceNamespace }}
  {{- if .Values.nexus.subscription.startingCSV }}
  startingCSV: {{ .Values.nexus.subscription.startingCSV }}
  {{- end }}