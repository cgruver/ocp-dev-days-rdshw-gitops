apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cekit-image-builder
  namespace: cekit-images
  labels:
    {{- include "cekit-builder.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
- kind: ServiceAccount
  name: cekit-builder
  namespace: cekit-images